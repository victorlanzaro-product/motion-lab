[project]
name = "motion-lab"
version = "0.1.0"
description = "Computer vision playground: webcam -> pose -> features -> gestures -> events"
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Added in later sprints; kept declared so the roadmap is visible from day one.
vision = ["mediapipe>=0.10.14"]
ml = ["scikit-learn>=1.5", "joblib>=1.4"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[dependency-groups]
# httpx backs fastapi's TestClient, which drives the WebSocket tests without a browser.
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
