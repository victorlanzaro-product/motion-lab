name: Feature request
description: Suggest an improvement
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, storage, or network impact
      description: Please do not include personal data or private recordings.
